# repocontext — repository registry
#
# Lists all repos that repocontext will index.
# Generated by `pnpm init:repos` or edit manually.

repositories:
  # Example — replace with your repos:
  # - name: my-web-app
  #   path: ~/code/my-web-app
  #   branches: [main]
  #
  # - name: my-api
  #   path: ~/code/my-api
  #   branches: [main, develop]
  #
  # - name: shared-lib
  #   path: ~/code/shared-lib
  #   branches: [main]

  []  # empty until you run `pnpm init:repos`
