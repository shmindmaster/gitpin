name: repocontext
services:
  - name: web
    github:
      repo: shmindmaster/repocontext
      branch: main
      deploy_on_push: true
    health_check:
      http_path: /health
      initial_delay_seconds: 10
      period_seconds: 30
    http_port: 3100
    instance_count: 1
    instance_size_slug: basic-xxs
    run_command: node dist/app/mcp-server.js
    build_command: pnpm install && pnpm build
    envs:
      - key: NODE_ENV
        value: production
