services:
  - type: web
    name: repocontext
    runtime: node
    buildCommand: pnpm install && pnpm build
    startCommand: node dist/app/mcp-server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: REPOCONTEXT_REPOS_ROOT
        sync: false
    autoDeploy: true
