<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title>GitPin PR gate synthetic fail-to-pass flow</title>
  <desc>A static diagram showing Phase A fail when docs/protocol.md is uncovered, and Phase B pass when a line-level locator for docs/protocol.md at commit bab63b... is provided.</desc>
  <defs>
    <style type="text/css">
      <![CDATA[
        .bg { fill: #f6f8fb; }
        .box { fill: #ffffff; stroke: #2b3b53; stroke-width: 2; }
        .title { fill: #0f172a; font: 700 28px Arial, sans-serif; }
        .label { fill: #0f172a; font: 600 20px Arial, sans-serif; }
        .body { fill: #1f2937; font: 500 18px Arial, sans-serif; }
        .statusFail { fill: #991b1b; font: 700 20px Arial, sans-serif; }
        .statusPass { fill: #065f46; font: 700 20px Arial, sans-serif; }
        .arrow { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrowhead); }
      ]]>
    </style>
  </defs>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#334155" />
    </marker>
  </defs>
  <rect width="1280" height="560" class="bg"/>
  <text x="36" y="52" class="title">GitPin 0.6.0: synthetic fail-to-pass PR evidence gate artifact</text>

  <g transform="translate(36,90)">
    <rect x="0" y="0" width="380" height="170" rx="10" class="box"/>
    <text x="24" y="38" class="label">Phase A (fail)</text>
    <text x="24" y="72" class="body">Command: gitpin gate --base BASE_SHA --head HEAD_SHA</text>
    <text x="24" y="102" class="body">Material path: docs/protocol.md</text>
    <text x="24" y="132" class="statusFail">Output: FAIL (uncovered path)</text>
  </g>

  <path class="arrow" d="M 445 175 L 550 175"/>
  <polygon points="550 175 535 169 535 181" fill="#334155"/>

  <g transform="translate(560,90)">
    <rect x="0" y="0" width="680" height="170" rx="10" class="box"/>
    <text x="24" y="38" class="label">Phase B (pass)</text>
    <text x="24" y="72" class="body">Locator: docs/protocol.md@bab63b08:5-5</text>
    <text x="24" y="102" class="body">contentSha256: 3abe23f770304e0849977cb46aac0cf5dc4a4d0ce7b92a8bf12f6960386f5ce1</text>
    <text x="24" y="132" class="statusPass">Output: PASS (coverage complete)</text>
  </g>

  <line x1="36" y1="320" x2="1244" y2="320" stroke="#cbd5e1" stroke-width="2"/>
  <text x="36" y="345" class="body">Base SHA: 982608f3b7521706cabbc39cd0ccf4b4036898fa</text>
  <text x="36" y="372" class="body">Head SHA: bab63b08df51151b6b375f2b6376fb441bcf3a8e</text>
  <text x="36" y="399" class="body">Repository: task-2-synthetic-pr-fixture</text>

  <text x="36" y="445" class="label">Reduced-motion-safe static artifact: this diagram includes no animation and no moving text.</text>
  <text x="36" y="475" class="body">Caption: fail then pass for one synthetic changed path using exact commit evidence.</text>
</svg>
