<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="696" viewBox="0 0 1120 696" role="img" aria-labelledby="title desc">
  <title>GitPin PR gate synthetic fail-to-pass flow</title>
