name: Publish package

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing version tag to verify or publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Install release toolchain
        run: npm install --global npm@12.0.2 pnpm@11.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm build
      - run: pnpm verify:package
      - name: Match tag to package version
        run: node scripts/verify-release-tag.mjs "${{ inputs.release_ref || github.ref_name }}"
      - name: Require tag commit on main
        run: |
          release_commit="$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$release_commit" origin/main
      - name: Publish package or verify bootstrap artifact
        run: |
          package_name="$(node -p 'require("./package.json").name')"
          package_version="$(node -p 'require("./package.json").version')"
          release_commit="$(git rev-parse HEAD)"
          package_spec="${package_name}@${package_version}"

          if npm view "$package_spec" version --registry "https://registry.npmjs.org" >/dev/null 2>&1; then
            published_commit="$(npm view "$package_spec" gitHead --registry "https://registry.npmjs.org")"
            if [ "$published_commit" != "$release_commit" ]; then
              echo "Published $package_spec does not match release commit $release_commit." >&2
              exit 1
            fi
            echo "$package_spec is already published from this commit; skipping duplicate publication."
          else
            npm publish --access public
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="${{ inputs.release_ref || github.ref_name }}"
          release_title="GitPin $(node -p 'require("./package.json").version')"

          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $release_tag already exists; skipping duplicate creation."
          else
            gh release create "$release_tag" --repo "$GITHUB_REPOSITORY" --title "$release_title" --generate-notes
          fi
