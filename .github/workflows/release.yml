name: Publish package

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Install release toolchain
        run: npm install --global npm@^11.5.1 pnpm@11.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm build
      - run: pnpm verify:package
      - name: Match tag to package version
        run: node scripts/verify-release-tag.mjs "$GITHUB_REF_NAME"
      - name: Require tag commit on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA^{commit}" origin/main
      - name: Publish package or verify bootstrap artifact
        run: |
          package_name="$(node -p \"require('./package.json').name\")"
          package_version="$(node -p \"require('./package.json').version\")"
          package_spec="${package_name}@${package_version}"

          if npm view "$package_spec" version --registry "https://registry.npmjs.org" >/dev/null 2>&1; then
            published_commit="$(npm view "$package_spec" gitHead --registry "https://registry.npmjs.org")"
            if [ "$published_commit" != "$GITHUB_SHA" ]; then
              echo "Published $package_spec does not match release commit $GITHUB_SHA." >&2
              exit 1
            fi
            echo "$package_spec is already published from this commit; skipping duplicate publication."
          else
            npm publish --access public
          fi
