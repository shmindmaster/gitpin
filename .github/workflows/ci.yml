name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: >-
      ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted", "Linux", "X64", "sh-runner-repocontext"]') }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global pnpm@11.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm build

  package:
    needs: validate
    runs-on: >-
      ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted", "Linux", "X64", "sh-runner-repocontext"]') }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --global pnpm@11.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm verify:package
      - run: pnpm audit --audit-level high
      - run: mkdir -p artifacts
      - run: npm pack --pack-destination artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: repocontext-package
          path: artifacts/*.tgz
          if-no-files-found: error

  package-runtime:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    runs-on: >-
      ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted", "Linux", "X64", "sh-runner-repocontext"]') }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v8
        with:
          name: repocontext-package
          path: artifacts
      - run: node scripts/verify-package.mjs artifacts/*.tgz

  website:
    needs: validate
    runs-on: >-
      ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted", "Linux", "X64", "sh-runner-repocontext"]') }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --global pnpm@11.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm site:test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: website-test-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
