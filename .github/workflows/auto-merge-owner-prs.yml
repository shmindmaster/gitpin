# Machine merge gate for maintainer-owned same-repo PRs targeting main.
#
# Human review is NOT required. Required status checks on `main` are the gate:
#   evidence, validate (22), validate (24), package, package-runtime (20),
#   package-runtime (22), package-runtime (24), website
#
# The workflow enables squash auto-merge while checks are pending. If GitHub
# reports the PR already clean, it squash-merges at the exact expected head.
# Both paths remain subject to the required checks and branch ruleset.
#
# Trust boundary, enforced in this order:
#   - only PRs targeting `main`, where the ruleset and required checks apply;
#   - only PRs opened by the repository owner from a same-repo head;
#   - only an event *sent by the owner* may arm or complete a merge. A
#     `synchronize` from a collaborator pushing to the owner's branch, or a
#     `labeled` from anyone applying `no-automerge`, still runs the job -- but
#     the controller may then only WITHDRAW an armed request, never arm one.
#     Filtering such events out (the earlier design) left armed requests live
#     exactly when they needed revoking;
#   - the `no-automerge` label is a real stop-switch for the same reason: it
#     withdraws, rather than merely skipping this run;
#   - the controller is read from the base revision, never from the PR.
name: Auto-merge owner PRs

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable-automerge:
    # Structural admission only. Who SENT the event is decided inside the
    # controller, because a non-owner event (a collaborator's push, anyone
    # applying no-automerge) must still run -- to withdraw, never to arm.
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Confused deputy: the controller below decides whether this PR gets
      # auto-merged, so it must never come from the PR. Reading it from the
      # base revision means a PR can only change the merge controller after
      # that change is merged, reviewed, and protected by the branch ruleset.
      #
      # The path is written after the PR checkout on purpose: checkout into a
      # subdirectory cannot shadow or be shadowed by PR content once it runs
      # second, and persist-credentials: false leaves no token in .git/config
      # for anything in either tree to read.
      #
      # Consequence: the PR that first introduces the controller fails here,
      # because the base revision has no controller yet. That is fail-closed
      # working as intended, not a defect to route around.
      - name: Check out auto-merge controller from the base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .github-base
          persist-credentials: false

      - name: Enable, complete, or withdraw protected squash merge
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const controllerPath = path.join(
              process.env.GITHUB_WORKSPACE,
              ".github-base/.github/scripts/owner-automerge.js"
            );
            if (!fs.existsSync(controllerPath)) {
              throw new Error(
                "Auto-merge controller missing from the base revision; refusing to act."
              );
            }
            const controller = require(controllerPath);
            await controller.enableOrMergeOwnerPr({
              github,
              core,
              pr: context.payload.pull_request,
              optOut: ${{ contains(github.event.pull_request.labels.*.name, 'no-automerge') }},
              trustedSender: ${{ github.event.sender.login == github.repository_owner && github.event.pull_request.draft == false }},
            });
