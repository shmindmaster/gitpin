name: GitPin Evidence Gate

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: evidence-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      # Post-publication boundary: commit-pin the self-gate to the published v0.6.2 release source.
      - uses: shmindmaster/gitpin@d2122379f4be315973a0bfa92bbd628e2cf7cfeb
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}
