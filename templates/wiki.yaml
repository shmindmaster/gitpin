# RepoContext exposure-policy template
#
# Drop this file in a repository registered with RepoContext.
# It narrows the documentation exposed to MCP clients.
#
# Copy from: templates/wiki.yaml
# Docs: docs/configuration.md

version: 2

# Default RepoContext behavior exposes supported documentation files. Add an
# explicit collection when only selected paths should be visible.
collections:
  - id: agent-context
    include:
      - README.md
      - CHANGELOG.md
      - docs/**/*.md

# Explicit exclusions (override expose)
safety:
  deny:
    - docs/internal/**
    - docs/drafts/**
    - "**/*secret*"
    - "**/*credential*"

# Policies are parsed from Git HEAD for local reads. Invalid YAML fails closed.
